[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "captrace-lab"
version = "0.2.0"
description = "Deterministic, offline security regression lab for AI agent tool permissions and revocation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Open-source contributors"}]
keywords = ["ai-agents", "security", "authorization", "revocation", "testing"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security", "Development Status :: 3 - Alpha"]

[project.scripts]
captrace = "captrace.cli:main"

[tool.setuptools.package-data]
captrace = ["scenarios/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
