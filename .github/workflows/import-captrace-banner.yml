name: Import CapTrace banner (one time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-captrace-banner.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'jamesjoycewatches-boop/captrace-agent-security'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify approved banner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --silent --show-error --location --retry 3 --max-time 90 --proto '=https' --tlsv1.2 \
            'https://cdn.shopify.com/s/files/1/0772/3656/8150/files/captrace-v0.2-github-banner.png?v=1793730661' \
            --output assets/captrace-v0.2-banner.png
          python - <<'PY'
          import hashlib, pathlib, struct
          image = pathlib.Path("assets/captrace-v0.2-banner.png").read_bytes()
          assert image[:8] == bytes.fromhex("89504e470d0a1a0a"), "Expected PNG"
          assert struct.unpack(">II", image[16:24]) == (1672, 941), "Unexpected dimensions"
          assert 100_000 < len(image) < 5_000_000, "Unexpected file size"
          print("Validated CDN-delivered PNG; bytes:", len(image))
          print("SHA-256:", hashlib.sha256(image).hexdigest())
          PY
      - name: Commit verified image only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/captrace-v0.2-banner.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: add verified CapTrace v0.2 infographic"
          git push origin HEAD:main
