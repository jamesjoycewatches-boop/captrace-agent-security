name: Import CapTrace banner (one time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-captrace-banner.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'jamesjoycewatches-boop/captrace-agent-security'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify approved banner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl --fail --silent --show-error --location --retry 3 --max-time 90 --proto '=https' --tlsv1.2 \
            'https://cdn.shopify.com/s/files/1/0772/3656/8150/files/captrace-v0.2-github-banner.png?v=1793730661' \
            --output assets/captrace-v0.2-banner.png
          echo '2366c4065ab6cc753a963fbd29423d679d4c1b5ce64bb19d2ac197b92bc887bb  assets/captrace-v0.2-banner.png' | sha256sum --check --status
          test "$(wc -c < assets/captrace-v0.2-banner.png)" -eq 1977406
      - name: Commit verified image only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/captrace-v0.2-banner.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: add verified CapTrace v0.2 infographic"
          git push origin HEAD:main
